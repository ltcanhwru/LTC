          <noscript>
            <ul class="post-list-fallback">
              <li><a href="bai/nth-thuy-dien-nuoc-trong-khong-co-mua-vu.html">NTH: nhà máy thủy điện gần như không có mùa vụ</a> Trong khi các mã cùng ngành có quý gấp tám lần quý khác, doanh thu quý của NTH chỉ dao động 26–37 tỷ. Lõi 99–109%, không nợ vay, trả về 69–110% lợi nhuận — nhưng tiền mặt chỉ 13 tỷ.</li>
              <li><a href="bai/nd2-loi-nhuan-loi-gap-ruoi-loi-nhuan-bao-cao.html">ND2: nhà máy làm ra 266 tỷ, cổ đông nhận 226 tỷ</a> Nợ vay bằng 58% vốn chủ — cao nhất nhóm thủy điện — nên mỗi năm khoảng 40 tỷ lợi nhuận cốt lõi chảy về ngân hàng. Nhưng tỷ lệ đó đang giảm đều từ 168% xuống 117%.</li>
              <li><a href="bai/s4a-se-san-4a-no-vay-va-mot-quy-bat-thuong.html">S4A: nợ vay 57% vốn chủ, và một quý lợi nhuận vượt cả lõi</a> Ba trên bốn năm lợi nhuận cốt lõi lớn hơn lợi nhuận trước thuế vì lãi vay. Rồi quý 1/2026 ngược lại: lãi 47 tỷ trong khi lõi chỉ 29 tỷ — một khoản tài chính chưa rõ nguồn.</li>
              <li><a href="bai/qph-co-tuc-gap-ba-lan-loi-nhuan.html">QPH: cổ tức gấp hơn ba lần lợi nhuận</a> Lãi 89 tỷ, chi 298 tỷ cổ tức — tỷ lệ 334%, cao nhất trong 66 mã qua bộ lọc. Nhưng khoản đó rút kho tiền xuống còn 22 tỷ, chính là nguồn tạo ra một phần tư lợi nhuận bốn năm qua.</li>
              <li><a href="bai/sbh-song-ba-ha-mot-quy-bang-ca-nua-nam.html">SBH: một quý bằng cả nửa năm</a> Quý 4/2025 doanh thu 472 tỷ với biên 77%; quý 2/2026 chỉ 58 tỷ với biên 38%. Hai quý cuối năm 2025 đóng góp 85% lợi nhuận cả năm — và biên 71% là cao nhất nhóm thủy điện được soi.</li>
              <li><a href="bai/szb-szl-hai-khu-cong-nghiep-sonadezi.html">SZB và SZL: hai khu công nghiệp Sonadezi, hai cách kiếm tiền khác nhau</a> Cùng tập đoàn, cùng doanh thu quanh 520–535 tỷ, nhưng lợi nhuận cốt lõi chênh 60% và P/E chênh gần gấp đôi. Một bên phụ thuộc từng hợp đồng lớn, một bên có dòng tiền vượt lợi nhuận 55–79% suốt bốn năm.</li>
              <li><a href="bai/cll-cang-cat-lai-bien-gop-dao-dong-manh.html">CLL: doanh thu tăng 52%, nhưng lợi nhuận cốt lõi chỉ tăng 12%</a> Doanh thu tăng 136 tỷ trong ba năm, lợi nhuận gộp chỉ tăng 20 tỷ — phần tăng thêm có biên khoảng 15% so với biên trung bình 36–47%. Doanh thu của CLL gần như không liên quan tới lợi nhuận.</li>
              <li><a href="bai/dnh-da-nhim-ham-thuan-da-mi-19000-ty-gan-nhu-khong-giao-dich.html">DNH: doanh nghiệp 19.000 tỷ gần như không có ai giao dịch</a> Vốn hóa lớn hơn nhiều mã trong VN30 nhưng mỗi phiên chỉ khớp dưới 10 triệu đồng. Biên gộp 52–64%, lõi tới 99%, dòng tiền vượt lợi nhuận 13% qua bốn năm — và quý 2/2026 là quý tốt nhất chuỗi.</li>
              <li><a href="bai/bay-cong-ty-cap-nuoc-va-mot-nghich-ly-bien-loi-nhuan.html">Bảy công ty cấp nước, và nghịch lý biên lợi nhuận</a> Cùng bán nước sạch trong địa bàn độc quyền, nhưng biên lợi nhuận gộp chênh nhau hơn ba lần và P/E chênh từ 3,1 tới 20,4. Lời giải nằm ở chỗ doanh nghiệp tự khai thác nước hay mua sỉ về phân phối.</li>
              <li><a href="bai/bws-cap-nuoc-ba-ria-vung-tau-bien-mo-ra.html">BWS: biên lợi nhuận mở ra, nhưng một phần năm lợi nhuận đến từ nơi khác</a> Lợi nhuận trước thuế năm 2025 tăng nhẹ, nhưng phần lõi lại giảm 30 tỷ — khoản chênh được bù bằng doanh thu tài chính gần gấp đôi. Tỷ trọng từ lõi rơi từ 91% xuống 79%.</li>
              <li><a href="bai/vav-viwaco-bien-mong-nhat-nganh-nuoc.html">VAV: biên mỏng nhất ngành nước, và một năm bất thường</a> Biên gộp 23% vì giá vốn chính là tiền mua nước sỉ. Năm 2024 biên nhảy lên 32% rồi rơi lại — doanh nghiệp không kiểm soát được cả giá đầu vào lẫn giá đầu ra.</li>
              <li><a href="bai/nct-song-sinh-voi-scs-o-noi-bai.html">NCT: người song sinh của SCS ở đầu kia đất nước</a> ROE tám năm chưa lần nào dưới 44%, doanh thu tăng 65% trong ba năm, không một đồng nợ vay. Cùng làm ga hàng hóa hàng không như SCS nhưng biên gộp thấp hơn 31 điểm — và không chịu rủi ro Long Thành.</li>
              <li><a href="bai/66-co-phieu-tot-ma-gan-nhu-khong-ai-mua-duoc.html">66 cổ phiếu tốt mà gần như không ai mua được</a> Bỏ hẳn bộ lọc thanh khoản, 66 mã qua được bài kiểm tra ROE bền tám năm. Trung vị P/B rẻ hơn nhóm thanh khoản tốt 27%, trong khi thanh khoản kém hơn 273 lần — và chiết khấu đó không tự đóng lại.</li>
              <li><a href="bai/vlw-bien-gop-66-phan-tram-cao-nhat-nganh-nuoc.html">VLW: biên lợi nhuận gộp 66%, cao nhất ngành nước</a> Gần gấp ba lần mã thấp nhất cùng ngành, và giữ nguyên suốt bốn năm. Nhưng 22–29% lợi nhuận đến từ kho tiền 298 tỷ, và biên cao nhất ngành cũng là thứ dễ bị điều chỉnh giá nhất.</li>
              <li><a href="bai/pmw-56-ty-doanh-thu-tai-chinh-tren-4-ty-tien-mat.html">PMW: 56 tỷ doanh thu tài chính trên 4 tỷ tiền mặt</a> Khoản này chiếm 44% lợi nhuận trước thuế nhưng không thể là lãi tiền gửi. Cùng một mức lợi nhuận cốt lõi 17 tỷ, có quý lãi 36 tỷ và có quý chỉ 15 tỷ — chênh nhau 2,4 lần.</li>
              <li><a href="bai/dnn-cap-nuoc-da-nang-bien-gop-tang-gap-ruoi.html">DNN: biên lợi nhuận gộp tăng từ 31% lên 44% trong một năm</a> Lợi nhuận cốt lõi hơn gấp đôi lên 251 tỷ và mức biên mới đã giữ được sáu quý. P/E 3,1 và P/B 0,90 — rẻ nhất nhóm cấp nước, trong khi mã cùng ngành đang ở P/E 20,4.</li>
              <li><a href="bai/btw-pe-20-lan-trong-khi-loi-nhuan-dang-giam.html">BTW: P/E 20 lần trong khi lợi nhuận quý đang giảm</a> Biên gộp giảm sáu quý liền từ 42% xuống 36%, lợi nhuận cốt lõi chỉ tăng 16% trong ba năm — nhưng bội số cao gấp gần bảy lần một doanh nghiệp cùng ngành.</li>
              <li><a href="bai/tdw-tien-ve-gap-ba-lan-loi-nhuan.html">TDW: tiền về gấp ba lần lợi nhuận</a> Bốn năm lợi nhuận 219 tỷ nhưng thu về 520 tỷ tiền. Doanh thu lớn nhất nhóm cấp nước mà vốn hóa nhỏ nhất — vì 400 tỷ lợi nhuận gộp bị chi phí vận hành mạng lưới lấy đi.</li>
              <li><a href="bai/pnp-tan-cang-phu-huu-tien-bang-mot-nua-von-hoa.html">PNP: doanh thu đứng yên bốn năm, tiền bằng 55% vốn hóa</a> Bốn năm doanh thu tăng đúng 4% và lợi nhuận cốt lõi đi ngang quanh 52–59 tỷ. Trong bốn mã Tân Cảng, đây là mã duy nhất không tăng trưởng — dấu hiệu một cảng đã chạm trần công suất.</li>
              <li><a href="bai/lix-net-hai-nha-may-bot-giat.html">LIX và NET: hai nhà máy bột giặt, và một quý sụp đổ</a> Quý 2/2026, biên gộp của NET rơi từ 21% xuống 12% và lợi nhuận cốt lõi từ 42 tỷ xuống 3 tỷ — trong khi LIX cùng quý giữ biên 25%, cao nhất sáu quý. Việc LIX không chịu tác động tương tự là manh mối quan trọng.</li>
              <li><a href="bai/sgc-sa-giang-doanh-thu-tang-67-phan-tram.html">SGC: doanh thu tăng 67%, lợi nhuận cốt lõi tăng 153%</a> Biên gộp mở từ 26% lên 30%, lõi 93–99%, dòng tiền vượt lợi nhuận bốn năm liền, gần như không nợ — và giao dịch ở P/E 5,7. Nhưng cổ tức chỉ 0–14% và mỗi phiên chỉ khớp bốn mươi triệu đồng.</li>
              <li><a href="bai/gdt-go-duc-thanh-doanh-thu-giam-loi-nhuan-tang.html">GDT: doanh thu giảm 17%, lợi nhuận cốt lõi tăng 19%</a> Biên gộp đi từ 29% lên 42% trong hai năm và giữ được sáu quý. Doanh thu giảm mà biên tăng là hình dạng của việc chủ động bỏ bớt đơn hàng giá thấp, không phải mất thị phần.</li>
              <li><a href="bai/m10-may-10-tien-bang-86-phan-tram-von-hoa.html">M10: doanh thu 5.011 tỷ, vốn hóa 625 tỷ</a> Biên gộp 11% nên quy mô doanh thu không nói lên gì về giá trị. Nhưng có một dòng đáng chú ý: 114–121 tỷ doanh thu tài chính mỗi năm, có năm vượt cả lợi nhuận cốt lõi — trên kho tiền 537 tỷ.</li>
              <li><a href="bai/skv-skh-hai-doanh-nghiep-yen-sao-mat-mot-phan-ba-doanh-thu.html">SKV và SKH: hai doanh nghiệp yến sào cùng mất hơn một phần ba doanh thu</a> Hai doanh nghiệp độc lập trên sổ sách nhưng doanh thu giảm đúng cùng một tỷ lệ 36% trong cùng giai đoạn, rồi cùng bật lại ở quý 1/2026. Mức độ đồng pha ấy nói lên nhiều hơn từng con số riêng lẻ.</li>
              <li><a href="bai/ast-taseco-doanh-thu-gap-ba-bien-gop-64-phan-tram.html">AST: doanh thu gấp gần ba lần, biên lợi nhuận gộp 64%</a> Lợi nhuận cốt lõi tăng hơn mười lần trong ba năm nhờ đòn bẩy vận hành trong giai đoạn hàng không phục hồi. Nhưng đòn bẩy đó chạy theo cả hai chiều — năm 2022 đã chứng minh điều này.</li>
              <li><a href="bai/ttd-benh-vien-tim-tam-duc-pe-35-lan.html">TTD: P/E 35 lần cho một doanh nghiệp tăng 5% mỗi năm</a> Chất lượng lợi nhuận gần như tuyệt đối — không nợ vay, dòng tiền vượt lợi nhuận bốn năm liền trong biên độ chỉ 112–119%. Nhưng lợi nhuận đứng yên bốn năm và hai quý gần nhất giảm 24–28%.</li>
              <li><a href="bai/vcf-vinacafe-hai-nam-khong-chia-roi-tra-gap-doi-loi-nhuan.html">VCF: hai năm không chia cổ tức, rồi trả gấp đôi lợi nhuận</a> Chi 149% rồi 246% lợi nhuận hai năm liền, rút kho tiền xuống còn 1% vốn hóa — thấp nhất trong 66 mã. Nhưng biên cốt lõi chỉ kém biên gộp đúng một điểm phần trăm, cấu trúc chi phí tinh gọn hiếm thấy.</li>
              <li><a href="bai/vfg-lai-gan-1700-ty-bon-nam-tien-ve-mot-phan-nam.html">VFG: bốn năm lãi 1.362 tỷ, tiền về chưa tới một phần năm</a> Dòng tiền kinh doanh bốn năm chỉ đạt 8% lợi nhuận, hai năm đầu âm. Và năm 2024 có 169 tỷ lãi công ty liên kết một lần làm lợi nhuận trông cao hơn thực tế 52%.</li>
              <li><a href="bai/vgr-cang-xanh-vip-pb-gan-10-lan.html">VGR: P/B gần 10 lần cho một cảng container</a> Không mã nào trong 66 cổ phiếu qua bộ lọc gần con số đó. Nhưng ROE đã tăng liên tục lên 52%, lợi nhuận cốt lõi tăng 67% trong ba năm, không nợ vay — và vốn chủ chỉ 1.194 tỷ.</li>
              <li><a href="bai/dp1-lai-tang-nhung-tien-chay-nguoc.html">DP1: lãi 145 tỷ, tiền kinh doanh âm 183 tỷ</a> Bốn năm báo lãi 427 tỷ nhưng dòng tiền kinh doanh cộng dồn âm 22 tỷ — trong khi doanh thu gần như đứng yên, nên tăng trưởng không phải nguyên nhân. Nợ vay bằng 104% vốn chủ.</li>

              <li><a href="bai/co-phieu-nganh-nuoc-va-bay-thanh-khoan.html">Tám cổ phiếu ngành nước và cái bẫy thanh khoản</a> Ba mô hình kinh doanh nấp dưới một ngành tưởng như đồng nhất, và một khoảng cách thanh khoản hơn một trăm lần: có mã khớp 34.400 cổ phiếu một phiên, có mã cả phiên không khớp nổi một đơn vị nào. P/E 6,3 ở đây không phải món hời.</li>
              <li><a href="bai/phan-bon-2026-ben-ban-ure-va-ben-mua-ure.html">Phân bón 2026: bên bán urê và bên mua urê</a> Đạm Hà Bắc lãi 852,8 tỷ trong sáu tháng, gấp gần 15 lần cùng kỳ. Supe Lâm Thao, cùng một công ty mẹ Vinachem, lãi 50,5 tỷ, giảm 59%. Giá urê đi từ 492,5 lên 900 USD/tấn rồi rơi về chỗ cũ trong bốn tháng, và nó chia ngành phân bón theo đúng một đường: ai bán urê, ai mua urê.</li>
              <li><a href="bai/benjamin-graham-88-co-phieu-net-net-va-7-ma-mua-duoc.html">Benjamin Graham: 88 cổ phiếu net-net ở Việt Nam và 7 mã mua được</a> Công thức khắt khe nhất Graham từng viết vẫn tìm ra 88 cổ phiếu Việt Nam giao dịch dưới hai phần ba tài sản lưu động ròng. Chỉ 7 mã khớp trên 1 tỷ đồng một phiên, và khi áp đúng mức chiết khấu của chính Graham thì 88 mã còn 39.</li>
              <li><a href="bai/phong-cach-warren-buffett-19-7-phan-tram-mot-nam.html">Phong cách Warren Buffett: 19,7% một năm và 176 tỷ đô la không phải của mình</a> Sáu mươi năm, 19,7% mỗi năm so với 10,5% của S&amp;P 500. Phần ít được nhắc tới nằm ở 176 tỷ đô la float bảo hiểm với chi phí vốn âm. Phần chép lại được thì đo được ngay trên sàn Việt Nam: trong 140 mã có ROE trên 20% hồi 2021, chỉ 60 mã giữ được.</li>
              <li><a href="bai/nhua-2026-lai-ky-luc-tren-kho-hang-gia-cu.html">Nhựa 2026: lãi kỷ lục trên kho hàng giá cũ</a> Nhựa Tiền Phong lãi trước thuế 879,7 tỷ trong sáu tháng — bằng 97,7% kế hoạch cả năm mà chính họ đặt ra hồi tháng 4. Biên gộp quý II vọt lên 37,7% đúng vào quý bột PVC đắt hơn 65% so với bình quân 2025. Khoảng cách giữa hai con số đó là bốn tháng tồn kho.</li>
              <li><a href="bai/dau-tu-gia-tri-re-khong-phai-la-mot-chien-luoc.html">Đầu tư giá trị: rẻ không phải là một chiến lược</a> 198 trong 601 cổ phiếu vốn hóa từ 500 tỷ đang được trả giá thấp hơn giá trị sổ sách. Xếp cả thị trường theo P/B rồi chờ 1, 3 và 5 năm, nhóm rẻ nhất đứng bét cả ba lần. Thứ tách nhóm rẻ ra làm hai nửa số phận không phải mức chiết khấu, mà là ROE.</li>
              <li><a href="bai/cach-dang-bai.html">Cách đăng bài lên trang này</a> Toàn bộ cú pháp bạn cần: viết chữ, chèn ảnh, nhúng video, làm bảng, trích dẫn. Đọc một lần là đăng bài được ngay.</li>
              <li><a href="bai/hoa-phat-va-gia-than.html">Hòa Phát và giá than</a> Lợi nhuận cao nhất bốn năm nhưng bội số thấp nhất kể từ 2021. Đi tìm chỗ lệch đó — và một mỏ than ở Sơn Tây.</li>
              <li><a href="bai/dri-gia-tri-cot-loi.html">DRI: mùa hái quả của vườn cao su bên Lào</a> Lợi nhuận bán niên tăng 83%, nợ vay giảm, cổ tức 7% sắp về tài khoản và một kế hoạch năm đã bị vượt 34% chỉ sau bảy tháng. Nhưng gần một nửa lợi nhuận kế toán không bao giờ đi tới túi cổ đông.</li>
              <li><a href="bai/vlog-mau.html">Vlog mẫu: một ngày làm việc</a> Bài mẫu cho dạng vlog — video nằm ngay đầu bài, phần chữ bên dưới là ghi chú và những điều tôi không kịp nói trong video.</li>
              <li><a href="bai/phan-tich-mau.html">Phân tích mẫu: đọc một con số cho đúng</a> Bài mẫu cho dạng phân tích — có bảng số liệu, trích dẫn nguồn, và phần tự chỉ ra chỗ lập luận còn yếu.</li>
            </ul>
