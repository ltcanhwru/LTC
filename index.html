<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <meta name="description" content="Blog cá nhân: bài viết, vlog và phân tích.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23b8452e'/><text x='50' y='70' font-size='58' font-family='Georgia,serif' fill='white' text-anchor='middle'>G</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="siteHeader"></div>

  <main>
    <section class="hero">
      <div class="wrap">
        <p class="hero-eyebrow" id="heroEyebrow">Blog cá nhân</p>
        <h1 id="heroHeading">Viết để nghĩ rõ hơn</h1>
        <p id="heroIntro">Nơi lưu lại những bài viết, vlog và phân tích cá nhân.</p>
      </div>
    </section>

    <div class="wrap">
      <div class="toolbar">
        <label class="search-field">
          <span class="visually-hidden">Tìm bài viết</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>
          </svg>
          <input type="search" id="searchInput" placeholder="Tìm theo tiêu đề, thẻ..." autocomplete="off">
        </label>
        <div class="tag-filters" id="tagFilters"></div>
      </div>

      <div class="post-grid" id="postGrid">
        <div class="empty-state">Đang tải bài viết…</div>
      </div>

      <div id="moreWrap" style="text-align:center; padding-bottom:72px;"></div>
    </div>
  </main>

  <div id="siteFooter"></div>

  <script src="js/config.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/site.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
