          <noscript>
            <ul class="post-list-fallback">
              <li><a href="bai/ghc-loi-nhuan-tang-nha-may-chay-cham.html">GHC: lợi nhuận tăng 49% trong lúc nhà máy chạy chậm lại</a> Quý II/2026, Thủy điện Gia Lai lãi tăng 49,3% trong khi doanh thu giảm 3,5% và lợi nhuận gộp giảm 12,4%. Cả khoảng chênh nằm ở một dòng lần đầu có số sau mười lăm quý: 20,6 tỷ lãi từ công ty liên kết.</li>
              <li><a href="bai/cdn-tien-chat-dong-va-cang-lien-chieu.html">CDN: tiền chất đống, cổ tức cắt một nửa, và cảng Liên Chiểu</a> Cảng Đà Nẵng lãi cao nhất lịch sử, giữ 1.063 tỷ tiền mặt bằng 42% vốn hóa, đầu tư chỉ bằng nửa khấu hao — nhưng cắt cổ tức từ 1.500 xuống 800 đồng. Và bến Tiên Sa, nơi làm ra phần lớn doanh thu, được quy hoạch chuyển thành cảng khách.</li>
              <li><a href="bai/fox-tang-truong-mua-bang-von-vay.html">FOX: tăng trưởng nhanh nhất nhiều năm, mua bằng vốn vay</a> FPT Telecom tăng doanh thu 15,1% trong sáu tháng — nhanh nhất kể từ khi lên sàn. Cùng kỳ, biên gộp rơi 3,5 điểm, lãi vay tăng 73%, và có bốn quý liên tiếp lợi nhuận đứng yên ở mức 884–886 tỷ.</li>
              <li><a href="bai/chi-so-cao-nhat-lich-su-dinh-gia-thap-nhat-tam-nam.html">Chỉ số cao nhất lịch sử, định giá thấp nhất tám năm</a> VN-Index đóng cửa ở 1.831,56 điểm, cao nhất từ trước tới nay. Cùng ngày, P/E trung vị của cổ phiếu vốn hóa từ 500 tỷ là 11,1 lần — thấp nhất trong tám năm dữ liệu — và 198 trên 602 mã giao dịch dưới giá trị sổ sách.</li>
              <li><a href="bai/php-quy-ky-luc-va-canh-cua-744-phan-tram.html">PHP: quý kỷ lục sau lưng một cánh cửa 7,44%</a> Cảng Hải Phòng lãi 425 tỷ trong quý II trên biên gộp 54,9%, nhưng sản lượng container chỉ tăng 3,1%. Phần tăng trưởng thật nằm ở một liên doanh không có trong doanh thu hợp nhất — và ở 92,56% cổ phần Nhà nước vừa được phép bán bớt.</li>
              <li><a href="bai/geg-mot-nua-loi-nhuan-gop-di-tra-lai.html">GEG: một nửa lợi nhuận gộp đi trả lãi</a> Điện Gia Lai có 24 nhà máy, biên lợi nhuận gộp 51% và 8.395 tỷ đồng nợ vay. Doanh thu bảy năm qua gấp 4,7 lần, nhưng năm 2024 lợi nhuận về cổ đông mẹ còn thấp hơn năm 2018 — toàn bộ phần tăng thêm đã đi vào tiền lãi.</li>
              <li><a href="bai/dhc-bien-loi-nhuan-gap-doi-sau-hai-nam.html">DHC: biên lợi nhuận gấp đôi sau hai năm chạm đáy</a> Bảy quý liên tiếp biên lợi nhuận gộp của Đông Hải Bến Tre đi lên, từ 11,2% tới 25,2%. Doanh thu chỉ tăng 19,8% trong khi lợi nhuận gấp 3,6 lần. Không có nhà máy mới nào chạy — chỉ có giá giấy.</li>
              <li><a href="bai/dcm-loi-nhuan-tang-tien-di-ra.html">DCM: lợi nhuận tăng 55%, tiền đi ra 863 tỷ</a> Đạm Cà Mau lãi 1.852,5 tỷ trong sáu tháng, tăng 54,7%. Cùng kỳ, dòng tiền kinh doanh âm 862,8 tỷ, tồn kho gấp đôi, phải thu gấp đôi và vay ngắn hạn gấp đôi.</li>
              <li><a href="bai/ree-ba-lop-giua-loi-nhuan-va-co-dong.html">REE: ba lớp giữa lợi nhuận và cổ đông</a> REE báo lãi 781,3 tỷ trong quý II. Trừ phần cổ đông thiểu số và phần lãi kế toán từ công ty liên kết, con số doanh nghiệp tự làm ra và thuộc về cổ đông của nó là 462,5 tỷ — bằng 59%.</li>
              <li><a href="bai/fpt-doanh-thu-giam-loi-nhuan-tang.html">FPT: doanh thu giảm 20%, lợi nhuận tăng 14%, và cả hai đều đúng</a> Từ 2026 FPT Telecom không còn nằm trong báo cáo hợp nhất của FPT. Tổng tài sản bốc hơi 19.556 tỷ trong một quý, biên lợi nhuận gộp tụt hơn năm điểm — mà không ai làm gì sai. Mọi so sánh doanh thu theo năm của FPT năm nay đều vô nghĩa.</li>
              <li><a href="bai/vnm-bien-loi-nhuan-quay-lai.html">VNM: biên lợi nhuận quay lại, còn bội số thì chưa</a> Vinamilk vừa có mười hai tháng doanh thu cao nhất lịch sử với biên gộp tốt nhất kể từ 2021, 18.048 tỷ tiền ròng và cổ tức 7,5%. Nhưng cổ phiếu vẫn ở P/E 11,9 — bằng nửa bội số mà thị trường từng trả cho chính doanh nghiệp này.</li>
              <li><a href="bai/hhv-nam-muoi-lam-dong-tren-mot-tram.html">HHV: cứ 100 đồng lợi nhuận gộp thì 55 đồng đi trả lãi</a> Đèo Cả thu 1.797 tỷ lợi nhuận gộp trên biên 45% và trả 981 tỷ tiền lãi vay. Cổ phiếu ở 0,51 lần giá trị sổ sách, nhưng EV/EBITDA 10,08 nói điều ngược lại — và cả hai đều đúng.</li>
              <li><a href="bai/co-phieu-tang-gap-doi-mot-nam-roi-sao-nua.html">Cổ phiếu tăng gấp đôi trong một năm, rồi sao nữa</a> Nhóm đã tăng trên 100% trong mười hai tháng cho mức tăng trung vị −15,4%, −16,6% và −16,1% ở ba lần thử tại ba giai đoạn thị trường khác hẳn nhau. Nhóm tốt nhất trong cả ba bảng là nhóm đã tăng vừa phải, dưới 50%.</li>
              <li><a href="bai/mot-ma-lam-nen-thi-truong.html">Một mã làm nên thị trường</a> Năm năm qua, bình quân gia quyền vốn hóa của thị trường tăng 54,5% trong khi cổ phiếu trung vị tăng 4,1%. Riêng Vingroup đóng góp 40% mức tăng ấy và chiếm 17,1% vốn hóa toàn sàn — nhiều hơn cả HNX cộng UPCoM.</li>
              <li><a href="bai/ba-san-mot-thi-truong-upcom-thang-nhung-khong-mua-duoc.html">Ba sàn một thị trường: UPCoM thắng, và không mua được</a> Cổ phiếu UPCoM vốn hóa từ 500 tỷ cho mức tăng trung vị cao hơn HOSE và HNX ở cả ba kỳ đo, dù những mã tốt nhất của sàn này đã chuyển đi nơi khác. Đổi lại, 694 trong 818 mã khớp dưới 100 triệu đồng một phiên — có mã vốn hóa 21.542 tỷ mà không đổi chủ.</li>
              <li><a href="bai/lai-tren-giay-109-doanh-nghiep-khong-thay-tien-ve.html">Lãi trên giấy: 109 doanh nghiệp năm năm không thấy tiền về</a> Năm năm qua, mỗi đồng lợi nhuận của 473 doanh nghiệp lớn nhất sàn đi kèm 79 xu tiền mặt. Riêng 109 doanh nghiệp có lãi lũy kế 154.770 tỷ nhưng dòng tiền kinh doanh âm 169.905 tỷ — và bù vào bằng 235.066 tỷ tiền vay.</li>
              <li><a href="bai/co-tuc-tien-mat-khong-phai-phan-thuong-no-la-bang-chung.html">Cổ tức tiền mặt không phải phần thưởng, nó là bằng chứng</a> 159 cổ phiếu không trả một đồng cổ tức nào hồi tháng 8/2021 có mức tăng giá trung vị −18,0% sau năm năm. Nhóm lợi suất trên 9% — nhóm vẫn bị gọi là bẫy — cho +27,8%. Khoảng cách ấy không đến từ tiền cổ tức, mà từ thứ mà việc trả được cổ tức tiết lộ.</li>
              <li><a href="bai/chung-khoan-2026-nghe-chinh-la-cho-vay.html">Chứng khoán 2026: nghề chính là cho vay</a> 41 công ty chứng khoán niêm yết thu 6.956 tỷ phí môi giới trong sáu tháng và chi ra 5.475 tỷ cho chính hoạt động đó. Tiền lãi cho vay cùng kỳ là 17.726 tỷ. Dư nợ đã gấp 3,27 lần sau ba năm, còn ROE toàn ngành rơi từ 11,2% xuống 9,6%.</li>
              <li><a href="bai/nghich-ly-beta-co-phieu-it-bien-dong-thang.html">Nghịch lý beta: cổ phiếu ít biến động thắng</a> Lý thuyết nói rủi ro cao đi kèm lợi nhuận cao. Trên sàn Việt Nam, nhóm beta cao nhất thua nhóm beta thấp nhất 24,6 điểm phần trăm ở kỳ ba năm. Nhưng lọc bỏ những mã khớp dưới 1 tỷ đồng một phiên thì bậc thang biến mất — chỉ còn lại nhóm beta cao nhất vẫn thua.</li>
              <li><a href="bai/30-doanh-nghiep-tang-doanh-thu-sau-nam-lien.html">30 doanh nghiệp tăng doanh thu sáu năm liền</a> Câu hỏi đầu tiên trong danh sách mười lăm điểm của Philip Fisher là về doanh thu, không phải lợi nhuận. Đếm trên 477 doanh nghiệp lớn của sàn Việt: chỉ 30 mã tăng doanh thu cả sáu năm, và chúng tăng giá 52,7% trong khi nhóm đi lùi mất hơn một nửa.</li>
              <li><a href="bai/muoi-nam-843-co-phieu-25-ma-nhan-muoi.html">Mười năm, 843 cổ phiếu: 25 mã nhân mười và 237 mã mất tiền</a> Cổ phiếu trung vị của sàn Việt Nam nhân 1,85 lần trong mười năm, tức khoảng 6,3% mỗi năm. Chỉ 3% số mã nhân được từ mười lần trở lên, và trái với lời khuyên của Peter Lynch, chúng tập trung ở nhóm vốn hóa lớn chứ không phải nhóm nhỏ.</li>
              <li><a href="bai/cong-thuc-ky-dieu-cua-greenblatt-tren-san-viet.html">Công thức kỳ diệu của Greenblatt trên sàn Việt</a> Ba lần thử ở ba giai đoạn thị trường khác hẳn nhau, ba mươi mã đầu bảng đều đứng trên trung vị và ba mươi mã cuối bảng đều thua từ 16% đến 34,6%. Vế &quot;không nên mua gì&quot; của công thức mạnh và ổn định hơn vế &quot;nên mua gì&quot;.</li>
              <li><a href="bai/mua-gan-day-52-tuan-va-mua-gan-dinh.html">Mua gần đáy 52 tuần và mua gần đỉnh</a> Xếp 559 cổ phiếu theo khoảng cách từ giá tới đáy 52 tuần: nhóm đứng gần đỉnh một năm mất 13,2% sau ba năm, nhóm vừa rời đáy khoảng ba mươi phần trăm tăng 21,9%. Nhóm sát đáy nhất không phải nhóm tốt nhất.</li>
              <li><a href="bai/pha-loang-von-gop-gap-ba-gia-con-hai-phan-ba.html">Pha loãng: vốn góp gấp ba, giá còn hai phần ba</a> Nhóm nhân vốn góp hơn ba lần trong năm năm mất 32,7% giá trị, đã tính lại cổ phiếu thưởng. Tách theo tiền thực thu thì kết quả đảo ngược cách đọc thông thường: nhóm phát hành lấy tiền mới mất 29,0%, nhóm chủ yếu chia thưởng lãi 25,8%.</li>
              <li><a href="bai/jesse-livermore-nguoi-doc-bang-gia.html">Jesse Livermore: người đọc bảng giá, và cái giá của việc chỉ đọc bảng giá</a> Kiếm ba triệu đô năm 1907, khoảng một trăm triệu năm 1929, phá sản năm 1934. Ba quy tắc ông viết ra — cắt lỗ ngay, không trung bình giá xuống, ngồi yên khi đúng — vẫn đứng vững sau một trăm năm. Chính ông là người không theo nổi chúng.</li>
              <li><a href="bai/cii-tam-muoi-dong-tren-mot-tram.html">CII: cứ 100 đồng lợi nhuận gộp thì 81 đồng đi trả lãi</a> CII thu 1.732 tỷ lợi nhuận gộp và trả 1.399 tỷ tiền lãi. Phần còn lại cho cổ đông công ty mẹ khoảng 110 tỷ — trên vốn hóa 9.878 tỷ. P/E 89,5 và P/B 1,02 nói hai điều hoàn toàn khác nhau.</li>
              <li><a href="bai/sip-mot-nua-loi-nhuan-den-tu-tien-gui.html">SIP: hơn một nửa lợi nhuận đến từ tiền gửi ngân hàng</a> Đầu tư Sài Gòn VRG thu 760 tỷ doanh thu tài chính trong mười hai tháng — bằng 53% lợi nhuận cổ đông mẹ — trên 10.895 tỷ tiền gửi. Đó là hệ quả của việc thu tiền thuê đất một lần cho cả năm mươi năm.</li>
