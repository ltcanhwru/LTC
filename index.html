              <li><a href="bai/dnw-muoi-hai-nam-cho-mot-quyet-dinh-gia.html">DNW: mười hai năm chờ một quyết định giá</a> Khung giá nước Đồng Nai vẫn là bản ký năm 2014. Biên lợi nhuận gộp đã rơi từ 40,1% xuống 36,7%, phương án giá mới nằm trên bàn tỉnh từ 2023. Nếu được duyệt, nó đáng khoảng 17% EPS — và có thể vừa đủ bù khấu hao của đợt nâng công suất 23%.</li>
              <li><a href="bai/ngan-hang-2026-loi-nhuan-tang-bo-dem-mong-di.html">Ngân hàng 2026: lợi nhuận tăng, bộ đệm mỏng đi</a> Lợi nhuận trước thuế của 27 ngân hàng niêm yết tăng 19,6% trong nửa đầu năm, nhưng 20 trong 27 cổ phiếu giảm giá suốt mười hai tháng. Chỗ lệch nằm ở 65.191 tỷ đồng: khoảng cách giữa nợ xấu đang có và dự phòng đã trích.</li>
              <li><a href="bai/thuy-san-2026-0-va-084-do-la-mot-ky.html">Thủy sản 2026: 0 và 0,84 đô la một ký</a> Cùng một con cá tra, cùng thị trường Mỹ: Vĩnh Hoàn chịu thuế chống bán phá giá 0 đô la một ký, Nam Việt chịu 0,84. Nửa đầu năm, doanh thu Nam Việt tăng 33,4% mà lợi nhuận gộp giảm 10,1% — biên rơi 8,2 điểm, đúng theo dòng thuế suất đó.</li>
              <li><a href="bai/cang-bien-2026-nuoc-sau-va-phan-con-lai.html">Cảng biển 2026: nước sâu và phần còn lại</a> Cùng một ngành, cùng sáu tháng bùng nổ sản lượng: một bên biên lợi nhuận gộp nhảy từ 43,0% lên 54,9%, bên kia tụt từ 14,2% xuống 12,1% và lợi nhuận đi lùi. Ranh giới là độ sâu mực nước trước bến.</li>
              <li><a href="bai/co-phieu-nganh-nuoc-va-bay-thanh-khoan.html">Tám cổ phiếu ngành nước và cái bẫy thanh khoản</a> Ba mô hình kinh doanh nấp dưới một ngành tưởng như đồng nhất, và một khoảng cách thanh khoản hơn một trăm lần: có mã khớp 34.400 cổ phiếu một phiên, có mã cả phiên không khớp nổi một đơn vị nào. P/E 6,3 ở đây không phải món hời.</li>
              <li><a href="bai/phan-bon-2026-ben-ban-ure-va-ben-mua-ure.html">Phân bón 2026: bên bán urê và bên mua urê</a> Đạm Hà Bắc lãi 852,8 tỷ trong sáu tháng, gấp gần 15 lần cùng kỳ. Supe Lâm Thao, cùng một công ty mẹ Vinachem, lãi 50,5 tỷ, giảm 59%. Giá urê đi từ 492,5 lên 900 USD/tấn rồi rơi về chỗ cũ trong bốn tháng, và nó chia ngành phân bón theo đúng một đường: ai bán urê, ai mua urê.</li>
              <li><a href="bai/benjamin-graham-88-co-phieu-net-net-va-7-ma-mua-duoc.html">Benjamin Graham: 88 cổ phiếu net-net ở Việt Nam và 7 mã mua được</a> Công thức khắt khe nhất Graham từng viết vẫn tìm ra 88 cổ phiếu Việt Nam giao dịch dưới hai phần ba tài sản lưu động ròng. Chỉ 7 mã khớp trên 1 tỷ đồng một phiên, và khi áp đúng mức chiết khấu của chính Graham thì 88 mã còn 39.</li>
              <li><a href="bai/phong-cach-warren-buffett-19-7-phan-tram-mot-nam.html">Phong cách Warren Buffett: 19,7% một năm và 176 tỷ đô la không phải của mình</a> Sáu mươi năm, 19,7% mỗi năm so với 10,5% của S&amp;P 500. Phần ít được nhắc tới nằm ở 176 tỷ đô la float bảo hiểm với chi phí vốn âm. Phần chép lại được thì đo được ngay trên sàn Việt Nam: trong 140 mã có ROE trên 20% hồi 2021, chỉ 60 mã giữ được.</li>
              <li><a href="bai/nhua-2026-lai-ky-luc-tren-kho-hang-gia-cu.html">Nhựa 2026: lãi kỷ lục trên kho hàng giá cũ</a> Nhựa Tiền Phong lãi trước thuế 879,7 tỷ trong sáu tháng — bằng 97,7% kế hoạch cả năm mà chính họ đặt ra hồi tháng 4. Biên gộp quý II vọt lên 37,7% đúng vào quý bột PVC đắt hơn 65% so với bình quân 2025. Khoảng cách giữa hai con số đó là bốn tháng tồn kho.</li>
              <li><a href="bai/dau-tu-gia-tri-re-khong-phai-la-mot-chien-luoc.html">Đầu tư giá trị: rẻ không phải là một chiến lược</a> 198 trong 601 cổ phiếu vốn hóa từ 500 tỷ đang được trả giá thấp hơn giá trị sổ sách. Xếp cả thị trường theo P/B rồi chờ 1, 3 và 5 năm, nhóm rẻ nhất đứng bét cả ba lần. Thứ tách nhóm rẻ ra làm hai nửa số phận không phải mức chiết khấu, mà là ROE.</li>
              <li><a href="bai/cach-dang-bai.html">Cách đăng bài lên trang này</a> Toàn bộ cú pháp bạn cần: viết chữ, chèn ảnh, nhúng video, làm bảng, trích dẫn. Đọc một lần là đăng bài được ngay.</li>
              <li><a href="bai/hoa-phat-va-gia-than.html">Hòa Phát và giá than</a> Lợi nhuận cao nhất bốn năm nhưng bội số thấp nhất kể từ 2021. Đi tìm chỗ lệch đó — và một mỏ than ở Sơn Tây.</li>
              <li><a href="bai/dri-gia-tri-cot-loi.html">DRI: giá trị cốt lõi của một vườn cao su bên Lào</a> 8.147 ha cao su đang khai thác ở Nam Lào, 265 tỷ tiền ròng, P/E dưới 5, và một kế hoạch năm đã bị chính công ty vượt 34% chỉ sau bảy tháng. Nhưng một nửa lợi nhuận kế toán không bao giờ đi tới túi cổ đông.</li>
              <li><a href="bai/vlog-mau.html">Vlog mẫu: một ngày làm việc</a> Bài mẫu cho dạng vlog — video nằm ngay đầu bài, phần chữ bên dưới là ghi chú và những điều tôi không kịp nói trong video.</li>
