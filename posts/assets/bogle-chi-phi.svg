<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 438" width="880" height="438" role="img" aria-label="Anh huong cua phi len 10.000 do trong 30 nam">
<style>.cvi text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--cv-tx,#15261a)}.cvi .t{font-size:17.5px;font-weight:650}.cvi .s{font-size:12.5px;fill:var(--cv-mu,#4b6551)}.cvi .v{font-size:12.5px;font-weight:650}.cvi .c{font-size:12.5px}.cvi .ax{font-size:11.5px;fill:var(--cv-mu,#4b6551)}.cvi .gl{stroke:var(--cv-gr,#dceed4);stroke-width:1}.cvi .bl{stroke:var(--cv-bd,#c8e2bd);stroke-width:1}</style>
<rect x="0.5" y="0.5" width="879" height="437" rx="14" fill="var(--cv-bg,#f6fbf3)" stroke="var(--cv-bd,#c8e2bd)"/>
<text class="t" x="36" y="40">Chi phí 2% một năm lấy đi một nửa số tiền cuối cùng</text>
<text class="s" x="36" y="62">Giá trị của 10.000 đô la sau ba mươi năm, giả định lợi suất gộp 8% một năm, chỉ khác nhau ở mức phí.</text>
<line class="bl" x1="120" y1="330.0" x2="836" y2="330.0"/><text class="ax" x="110" y="334.0" text-anchor="end">0</text>
<line class="gl" x1="120" y1="286.0" x2="836" y2="286.0"/><text class="ax" x="110" y="290.0" text-anchor="end">+20</text>
<line class="gl" x1="120" y1="242.0" x2="836" y2="242.0"/><text class="ax" x="110" y="246.0" text-anchor="end">+40</text>
<line class="gl" x1="120" y1="198.0" x2="836" y2="198.0"/><text class="ax" x="110" y="202.0" text-anchor="end">+60</text>
<line class="gl" x1="120" y1="154.0" x2="836" y2="154.0"/><text class="ax" x="110" y="158.0" text-anchor="end">+80</text>
<line class="gl" x1="120" y1="110.0" x2="836" y2="110.0"/><text class="ax" x="110" y="114.0" text-anchor="end">+100</text>
<rect x="163.8" y="111.8" width="110.0" height="218.2" rx="2" fill="var(--cv-a1,#2e7d43)"/>
<text class="v" x="218.8" y="104.8" text-anchor="middle">+99,2</text>
<text class="c" x="218.8" y="356" text-anchor="middle">Phí 0,05%</text>
<text class="ax" x="218.8" y="374" text-anchor="middle">quỹ chỉ số</text>
<rect x="341.3" y="137.3" width="110.0" height="192.7" rx="2" fill="var(--cv-a2,#9ecbaa)"/>
<text class="v" x="396.3" y="130.3" text-anchor="middle">+87,6</text>
<text class="c" x="396.3" y="356" text-anchor="middle">Phí 0,5%</text>
<rect x="518.8" y="184.4" width="110.0" height="145.6" rx="2" fill="var(--cv-n1,#a9bfb0)"/>
<text class="v" x="573.8" y="177.4" text-anchor="middle">+66,2</text>
<text class="c" x="573.8" y="356" text-anchor="middle">Phí 1,5%</text>
<rect x="696.3" y="220.4" width="110.0" height="109.6" rx="2" fill="var(--cv-neg,#c0562f)"/>
<text class="v" x="751.3" y="213.4" text-anchor="middle">+49,8</text>
<text class="c" x="751.3" y="356" text-anchor="middle">Phí 2,5%</text>
<text class="ax" x="751.3" y="374" text-anchor="middle">quỹ chủ động đắt</text>
<text class="s" x="36" y="400">Phép tính số học thuần túy, không phải kết quả thực tế của quỹ nào. Chênh lệch giữa cột đầu và cột cuối là 49.390 đô la.</text>
<text class="s" x="36" y="420">Đơn vị: nghìn đô la.</text>
</svg>