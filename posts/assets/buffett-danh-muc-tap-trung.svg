<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Ty trong cac vi the lon nhat trong danh muc co phieu niem yet cua Berkshire">
<style>.cvi text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--cv-tx,#15261a)}.cvi .t{font-size:17.5px;font-weight:650}.cvi .s{font-size:12.5px;fill:var(--cv-mu,#4b6551)}.cvi .v{font-size:12.5px;font-weight:650}.cvi .c{font-size:12.5px}.cvi .ax{font-size:11.5px;fill:var(--cv-mu,#4b6551)}.cvi .gl{stroke:var(--cv-gr,#dceed4);stroke-width:1}.cvi .bl{stroke:var(--cv-bd,#c8e2bd);stroke-width:1}</style>
<rect x="0.5" y="0.5" width="879" height="419" rx="14" fill="var(--cv-bg,#f6fbf3)" stroke="var(--cv-bd,#c8e2bd)"/>
<text class="t" x="36" y="40">Hai mươi chín mã, năm mã chiếm gần bảy phần mười</text>
<text class="s" x="36" y="62">Tỷ trọng trong danh mục cổ phiếu niêm yết 299,3 tỷ đô la của Berkshire Hathaway, báo cáo 13F quý II/2026.</text>

<line class="gl" x1="110" y1="141.4" x2="836" y2="141.4"/><text class="ax" x="100" y="145" text-anchor="end">30%</text>
<line class="gl" x1="110" y1="204.3" x2="836" y2="204.3"/><text class="ax" x="100" y="208" text-anchor="end">20%</text>
<line class="gl" x1="110" y1="267.1" x2="836" y2="267.1"/><text class="ax" x="100" y="271" text-anchor="end">10%</text>
<line class="bl" x1="110" y1="330" x2="836" y2="330"/><text class="ax" x="100" y="334" text-anchor="end">0</text>

<rect x="136" y="191.7" width="88" height="138.3" rx="2" fill="var(--cv-a1,#2e7d43)"/>
<text class="v" x="180" y="184" text-anchor="middle">22,0%</text>
<text class="c" x="180" y="354" text-anchor="middle">Apple</text>

<rect x="256" y="222.5" width="88" height="107.5" rx="2" fill="var(--cv-a1,#2e7d43)"/>
<text class="v" x="300" y="215" text-anchor="middle">17,1%</text>
<text class="c" x="300" y="354" text-anchor="middle">American Express</text>

<rect x="376" y="261.5" width="88" height="68.5" rx="2" fill="var(--cv-a1,#2e7d43)"/>
<text class="v" x="420" y="254" text-anchor="middle">10,9%</text>
<text class="c" x="420" y="354" text-anchor="middle">Coca-Cola</text>

<rect x="496" y="270.9" width="88" height="59.1" rx="2" fill="var(--cv-a1,#2e7d43)"/>
<text class="v" x="540" y="263" text-anchor="middle">9,4%</text>
<text class="c" x="540" y="354" text-anchor="middle">Alphabet</text>

<rect x="616" y="272.2" width="88" height="57.8" rx="2" fill="var(--cv-a1,#2e7d43)"/>
<text class="v" x="660" y="265" text-anchor="middle">9,2%</text>
<text class="c" x="660" y="354" text-anchor="middle">Bank of America</text>

<rect x="736" y="132.6" width="88" height="197.4" rx="2" fill="var(--cv-n1,#a9bfb0)"/>
<text class="v" x="780" y="125" text-anchor="middle">31,4%</text>
<text class="c" x="780" y="354" text-anchor="middle">24 mã còn lại</text>

<text class="s" x="36" y="392">Danh mục 13F chỉ gồm cổ phiếu niêm yết Mỹ; các công ty Berkshire sở hữu trọn vẹn và tiền mặt 373,3 tỷ đô</text>
<text class="s" x="36" y="410">không nằm trong bảng này. Nguồn: hồ sơ 13F ngày 14/08/2026 và báo cáo thường niên 2025 của Berkshire.</text>
