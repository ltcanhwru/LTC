<text class="ax" x="570" y="374" text-anchor="middle">21 mã · 6 mã tăng giá</text>

<rect x="695" y="242" width="110" height="64.7" rx="2" fill="var(--cv-neg,#c0562f)"/>
<text class="v" x="750" y="321" text-anchor="middle">−29,4%</text>
<text class="c" x="750" y="356" text-anchor="middle">tụt xuống dưới 10%</text>
<text class="ax" x="750" y="374" text-anchor="middle">32 mã · 2 mã tăng giá</text>

<text class="s" x="36" y="410">Cổ phiếu trung vị của toàn bộ vũ trụ 493 mã cùng kỳ: +3,6%. ROE tính bằng P/B chia P/E, vốn hóa từ 500 tỷ đồng.</text>
<text class="s" x="36" y="428">Từ 27/08/2021 đến 27/08/2026. Nguồn: API VNDirect.</text>
