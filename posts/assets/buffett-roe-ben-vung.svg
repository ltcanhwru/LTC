<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440" role="img" aria-label="Muc tang gia 5 nam theo viec giu duoc ROE cao">
<style>.cvi text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--cv-tx,#15261a)}.cvi .t{font-size:17.5px;font-weight:650}.cvi .s{font-size:12.5px;fill:var(--cv-mu,#4b6551)}.cvi .v{font-size:12.5px;font-weight:650}.cvi .c{font-size:12.5px}.cvi .ax{font-size:11.5px;fill:var(--cv-mu,#4b6551)}.cvi .gl{stroke:var(--cv-gr,#dceed4);stroke-width:1}.cvi .bl{stroke:var(--cv-bd,#c8e2bd);stroke-width:1}</style>
<rect x="0.5" y="0.5" width="879" height="439" rx="14" fill="var(--cv-bg,#f6fbf3)" stroke="var(--cv-bd,#c8e2bd)"/>
<text class="t" x="36" y="40">Thứ quyết định không phải ROE cao, mà là giữ được nó</text>
<text class="s" x="36" y="62">140 cổ phiếu có ROE từ 20% hồi tháng 8/2021, chia theo ROE của chính chúng hôm nay. Cột là mức tăng giá trung vị sau 5 năm.</text>

<line class="gl" x1="120" y1="110" x2="836" y2="110"/><text class="ax" x="110" y="114" text-anchor="end">+60%</text>
<line class="gl" x1="120" y1="154" x2="836" y2="154"/><text class="ax" x="110" y="158" text-anchor="end">+40%</text>
<line class="gl" x1="120" y1="198" x2="836" y2="198"/><text class="ax" x="110" y="202" text-anchor="end">+20%</text>
<line class="bl" x1="120" y1="242" x2="836" y2="242"/><text class="ax" x="110" y="246" text-anchor="end">0</text>
<line class="gl" x1="120" y1="286" x2="836" y2="286"/><text class="ax" x="110" y="290" text-anchor="end">−20%</text>
<line class="gl" x1="120" y1="330" x2="836" y2="330"/><text class="ax" x="110" y="334" text-anchor="end">−40%</text>

<rect x="155" y="133.8" width="110" height="108.2" rx="2" fill="var(--cv-a1,#2e7d43)"/>
<text class="v" x="210" y="126" text-anchor="middle">+49,2%</text>
<text class="c" x="210" y="356" text-anchor="middle">vẫn từ 20% trở lên</text>
<text class="ax" x="210" y="374" text-anchor="middle">60 mã · 49 mã tăng giá</text>

<rect x="335" y="179.1" width="110" height="62.9" rx="2" fill="var(--cv-a2,#9ecbaa)"/>
<text class="v" x="390" y="171" text-anchor="middle">+28,6%</text>
<text class="c" x="390" y="356" text-anchor="middle">tụt về 15 – 20%</text>
<text class="ax" x="390" y="374" text-anchor="middle">27 mã · 18 mã tăng giá</text>

<rect x="515" y="242" width="110" height="38.9" rx="2" fill="var(--cv-n1,#a9bfb0)"/>
<text class="v" x="570" y="295" text-anchor="middle">−17,7%</text>
