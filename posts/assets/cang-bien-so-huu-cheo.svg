<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-label="So do so huu cheo trong nganh cang bien: VIMC, Cang Hai Phong, Cang Dinh Vu va lien doanh HTIT">
