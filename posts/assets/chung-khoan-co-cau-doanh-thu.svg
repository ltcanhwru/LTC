<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Co cau doanh thu nganh chung khoan nua dau 2025 va 2026">
<style>.cvi text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--cv-tx,#15261a)}.cvi .t{font-size:17.5px;font-weight:650}.cvi .s{font-size:12.5px;fill:var(--cv-mu,#4b6551)}.cvi .v{font-size:12.5px;font-weight:650}.cvi .c{font-size:12.5px}.cvi .ax{font-size:11.5px;fill:var(--cv-mu,#4b6551)}.cvi .gl{stroke:var(--cv-gr,#dceed4);stroke-width:1}.cvi .bl{stroke:var(--cv-bd,#c8e2bd);stroke-width:1}</style>
<rect x="0.5" y="0.5" width="879" height="419" rx="14" fill="var(--cv-bg,#f6fbf3)" stroke="var(--cv-bd,#c8e2bd)"/>
<text class="t" x="36" y="38">Tiền lãi cho vay đã bỏ xa phí môi giới</text>
<text class="s" x="36" y="60">Doanh thu sáu tháng đầu năm của 41 công ty chứng khoán niêm yết, tỷ đồng.</text>

<rect x="600" y="72" width="14" height="14" rx="2" fill="var(--cv-a2,#9ecbaa)"/><text class="c" x="622" y="84">H1/2025</text>
<rect x="700" y="72" width="14" height="14" rx="2" fill="var(--cv-a1,#2e7d43)"/><text class="c" x="722" y="84">H1/2026</text>

<line class="gl" x1="120" y1="110" x2="836" y2="110"/><text class="ax" x="110" y="114" text-anchor="end">20.000</text>
<line class="gl" x1="120" y1="165" x2="836" y2="165"/><text class="ax" x="110" y="169" text-anchor="end">15.000</text>
<line class="gl" x1="120" y1="220" x2="836" y2="220"/><text class="ax" x="110" y="224" text-anchor="end">10.000</text>
<line class="gl" x1="120" y1="275" x2="836" y2="275"/><text class="ax" x="110" y="279" text-anchor="end">5.000</text>
<line class="bl" x1="120" y1="330" x2="836" y2="330"/><text class="ax" x="110" y="334" text-anchor="end">0</text>

<rect x="178" y="215.0" width="66" height="115.0" rx="2" fill="var(--cv-a2,#9ecbaa)"/>
