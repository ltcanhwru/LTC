<text class="c" x="250" y="354" text-anchor="middle">Lãi từ cho vay</text>
<text class="ax" x="250" y="372" text-anchor="middle">+69,5%</text>

<rect x="398" y="161.2" width="66" height="168.8" rx="2" fill="var(--cv-a2,#9ecbaa)"/>
<text class="v" x="431" y="154" text-anchor="middle">15.343</text>
