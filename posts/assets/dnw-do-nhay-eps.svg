<line class="bl" x1="110" y1="320" x2="836" y2="320"/><text class="ax" x="100" y="324" text-anchor="end">0</text>
<rect x="155" y="190.5" width="90" height="129.5" rx="2" fill="var(--cv-n1,#a9bfb0)"/><text class="v" x="200" y="183" text-anchor="middle">2.775</text>
<rect x="335" y="168.5" width="90" height="151.5" rx="2" fill="var(--cv-a1,#2e7d43)"/><text class="v" x="380" y="161" text-anchor="middle">3.246</text>
<rect x="515" y="145.7" width="90" height="174.3" rx="2" fill="var(--cv-a2,#9ecbaa)"/><text class="v" x="560" y="138" text-anchor="middle">3.736</text>
<rect x="695" y="123.2" width="90" height="196.8" rx="2" fill="var(--cv-a2,#9ecbaa)"/><text class="v" x="740" y="116" text-anchor="middle">4.216</text>
<text class="c" x="200" y="344" text-anchor="middle">Hiện tại</text><text class="ax" x="200" y="361" text-anchor="middle">P/E 11,2</text>
<text class="c" x="380" y="344" text-anchor="middle" fill="var(--cv-a1,#2e7d43)">+4,9%</text><text class="ax" x="380" y="361" text-anchor="middle">P/E 9,6</text>
<text class="c" x="560" y="344" text-anchor="middle">+10%</text><text class="ax" x="560" y="361" text-anchor="middle">P/E 8,3</text>
<text class="c" x="740" y="344" text-anchor="middle">+15%</text><text class="ax" x="740" y="361" text-anchor="middle">P/E 7,4</text>
<text class="ax" x="380" y="380" text-anchor="middle" fill="var(--cv-a1,#2e7d43)">phương án DNW đề xuất, theo ước tính FPTS</text>
<text class="s" x="36" y="406">Quyết định mà thị trường chờ mười hai năm đáng khoảng +17% EPS — thật và đáng kể, nhưng không phải một cú nhân đôi.</text>
