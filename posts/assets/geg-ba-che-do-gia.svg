<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450" role="img" aria-label="Gia ban dien binh quan cua GEG theo nhom nha may, dong tren mot kWh">
<style>.cvi text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--cv-tx,#15261a)}.cvi .t{font-size:17.5px;font-weight:650}.cvi .s{font-size:12.5px;fill:var(--cv-mu,#4b6551)}.cvi .v{font-size:12.5px;font-weight:650}.cvi .c{font-size:12.5px}.cvi .ax{font-size:11.5px;fill:var(--cv-mu,#4b6551)}.cvi .gl{stroke:var(--cv-gr,#dceed4);stroke-width:1}.cvi .bl{stroke:var(--cv-bd,#c8e2bd);stroke-width:1}.cvi .ln{stroke:var(--cv-mu,#4b6551);stroke-width:1.4;fill:none}.cvi .dl{stroke:var(--cv-n1,#a9bfb0);stroke-width:2}</style>
<rect x="0.5" y="0.5" width="879" height="449" rx="14" fill="var(--cv-bg,#f6fbf3)" stroke="var(--cv-bd,#c8e2bd)"/><text class="t" x="36" y="40">Cùng một danh mục, giá bán chênh nhau hơn hai lần</text>
<text class="s" x="36" y="62">Giá bán điện bình quân theo nhóm nhà máy của GEG, đồng trên một kWh. Cột đậm là các nhà máy kịp hưởng giá FIT.</text>
<line class="bl" x1="110" y1="330" x2="844" y2="330"/><text class="ax" x="100" y="334" text-anchor="end">0</text>
<line class="gl" x1="110" y1="260" x2="844" y2="260"/><text class="ax" x="100" y="264" text-anchor="end">800</text>
<line class="gl" x1="110" y1="190" x2="844" y2="190"/><text class="ax" x="100" y="194" text-anchor="end">1.600</text>
<line class="gl" x1="110" y1="120" x2="844" y2="120"/><text class="ax" x="100" y="124" text-anchor="end">2.400</text>
<rect x="146.8" y="239.4" width="84" height="90.6" rx="2" fill="var(--cv-n1,#a9bfb0)"/>
<text class="v" x="188.8" y="230.4" text-anchor="middle">1.035</text>
<text class="c" x="188.8" y="354" text-anchor="middle">Thủy điện</text>
<text class="ax" x="188.8" y="371" text-anchor="middle">12 nhà máy nhỏ</text>
<rect x="292.4" y="226.3" width="84" height="103.7" rx="2" fill="var(--cv-neg,#c0562f)"/>
<text class="v" x="334.4" y="217.3" text-anchor="middle">1.185</text>
<text class="c" x="334.4" y="354" text-anchor="middle">Điện mặt trời</text>
<text class="ax" x="334.4" y="371" text-anchor="middle">Đức Huệ 2 (mới)</text>
<rect x="438" y="171.4" width="84" height="158.6" rx="2" fill="var(--cv-wa,#bf860f)"/>
<text class="v" x="480" y="162.4" text-anchor="middle">1.813</text>
<text class="c" x="480" y="354" text-anchor="middle">Điện gió</text>
<text class="ax" x="480" y="371" text-anchor="middle">chuyển tiếp</text>
<rect x="583.6" y="134.5" width="84" height="195.5" rx="2" fill="var(--cv-a1,#2e7d43)"/>
<text class="v" x="625.6" y="125.5" text-anchor="middle">2.234</text>
<text class="c" x="625.6" y="354" text-anchor="middle">Điện mặt trời</text>
<text class="ax" x="625.6" y="371" text-anchor="middle">5 trang trại FIT1</text>
<rect x="729.2" y="130.7" width="84" height="199.3" rx="2" fill="var(--cv-a1,#2e7d43)"/>
<text class="v" x="771.2" y="121.7" text-anchor="middle">2.278</text>
<text class="c" x="771.2" y="354" text-anchor="middle">Điện gió</text>
<text class="ax" x="771.2" y="371" text-anchor="middle">FIT 9,8 UScent</text>
<text class="s" x="36" y="406">Thủy điện và điện mặt trời là giá thực hiện năm 2024. Điện gió chuyển tiếp là giá ký chính thức tháng 3/2025 cho Tân Phú</text>
<text class="s" x="36" y="425">Đông 1; Đức Huệ 2 là ước tính của KIS theo khung giá mới; giá điện gió FIT là số tôi suy ra, xem mục lưu ý.</text>
</svg>
