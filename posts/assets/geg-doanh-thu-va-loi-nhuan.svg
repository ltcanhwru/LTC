<text class="v" x="803.2" y="248" text-anchor="middle" fill="var(--cv-wa,#bf860f)">275</text>
<text class="s" x="36" y="400">Hai năm 2023 và 2024, lợi nhuận về cổ đông mẹ thấp hơn cả năm 2018 — thời điểm GEG mới có 560 tỷ đồng doanh thu và</text>
<text class="s" x="36" y="419">gần như chưa vay nợ. Đỉnh 2025 đến từ doanh thu hồi tố của Tân Phú Đông 1 và khoản thoái vốn thủy điện Trường Phú.</text>
