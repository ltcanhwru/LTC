<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 438" width="880" height="438" role="img" aria-label="Tai san ke toan sau chiet khau va sau khi tru no">
<style>.cvi text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--cv-tx,#15261a)}.cvi .t{font-size:17.5px;font-weight:650}.cvi .s{font-size:12.5px;fill:var(--cv-mu,#4b6551)}.cvi .v{font-size:12.5px;font-weight:650}.cvi .c{font-size:12.5px}.cvi .ax{font-size:11.5px;fill:var(--cv-mu,#4b6551)}.cvi .gl{stroke:var(--cv-gr,#dceed4);stroke-width:1}.cvi .bl{stroke:var(--cv-bd,#c8e2bd);stroke-width:1}</style>
<rect x="0.5" y="0.5" width="879" height="437" rx="14" fill="var(--cv-bg,#f6fbf3)" stroke="var(--cv-bd,#c8e2bd)"/>
<text class="t" x="36" y="40">Tài sản trên sổ 800 tỷ, phần thu hồi được 311 tỷ</text>
<text class="s" x="36" y="62">Một doanh nghiệp giả định, đi qua đúng ba bước mà Graham làm trước khi so với giá thị trường.</text>
<line class="bl" x1="120" y1="330.0" x2="836" y2="330.0"/><text class="ax" x="110" y="334.0" text-anchor="end">0</text>
<line class="gl" x1="120" y1="275.0" x2="836" y2="275.0"/><text class="ax" x="110" y="279.0" text-anchor="end">+200</text>
<line class="gl" x1="120" y1="220.0" x2="836" y2="220.0"/><text class="ax" x="110" y="224.0" text-anchor="end">+400</text>
<line class="gl" x1="120" y1="165.0" x2="836" y2="165.0"/><text class="ax" x="110" y="169.0" text-anchor="end">+600</text>
<line class="gl" x1="120" y1="110.0" x2="836" y2="110.0"/><text class="ax" x="110" y="114.0" text-anchor="end">+800</text>
<rect x="163.8" y="110.0" width="110.0" height="220.0" rx="2" fill="var(--cv-n1,#a9bfb0)"/>
<text class="v" x="218.8" y="103.0" text-anchor="middle">+800</text>
<text class="c" x="218.8" y="356" text-anchor="middle">Tài sản kế toán</text>
<text class="ax" x="218.8" y="374" text-anchor="middle">cộng thẳng trên sổ</text>
<rect x="341.3" y="162.0" width="110.0" height="168.0" rx="2" fill="var(--cv-a2,#9ecbaa)"/>
<text class="v" x="396.3" y="155.0" text-anchor="middle">+611</text>
<text class="c" x="396.3" y="356" text-anchor="middle">Sau chiết khấu</text>
<text class="ax" x="396.3" y="374" text-anchor="middle">theo mức thu hồi</text>
<rect x="518.8" y="244.5" width="110.0" height="85.5" rx="2" fill="var(--cv-neg,#c0562f)"/>
<text class="v" x="573.8" y="237.5" text-anchor="middle">+311</text>
<text class="c" x="573.8" y="356" text-anchor="middle">Trừ nợ phải trả</text>
<text class="ax" x="573.8" y="374" text-anchor="middle">giá trị ròng</text>
<rect x="696.3" y="192.5" width="110.0" height="137.5" rx="2" fill="var(--cv-wa,#bf860f)"/>
<text class="v" x="751.3" y="185.5" text-anchor="middle">+500</text>
<text class="c" x="751.3" y="356" text-anchor="middle">Vốn hóa thị trường</text>
<text class="ax" x="751.3" y="374" text-anchor="middle">giá phải trả</text>
<text class="s" x="36" y="400">Chiết khấu áp dụng: tiền giữ nguyên, phải thu 80%, hàng tồn kho 60%, tài sản cố định 70%. Nợ phải trả 300 tỷ.</text>
<text class="s" x="36" y="420">Đơn vị: tỷ đồng. Đây là ví dụ minh họa, không phải doanh nghiệp có thật.</text>
</svg>