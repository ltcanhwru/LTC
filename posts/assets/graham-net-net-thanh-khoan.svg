<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Tu 1055 co phieu con 7 ma net-net mua duoc">
<style>.cvi text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--cv-tx,#15261a)}.cvi .t{font-size:17.5px;font-weight:650}.cvi .s{font-size:12.5px;fill:var(--cv-mu,#4b6551)}.cvi .v{font-size:12.5px;font-weight:650}.cvi .c{font-size:12.5px}.cvi .ax{font-size:11.5px;fill:var(--cv-mu,#4b6551)}.cvi .gl{stroke:var(--cv-gr,#dceed4);stroke-width:1}.cvi .bl{stroke:var(--cv-bd,#c8e2bd);stroke-width:1}</style>
<rect x="0.5" y="0.5" width="879" height="419" rx="14" fill="var(--cv-bg,#f6fbf3)" stroke="var(--cv-bd,#c8e2bd)"/>
<text class="t" x="36" y="40">Công thức 1934 tìm ra 88 mã, và gần như không mua được mã nào</text>
<text class="s" x="36" y="62">Số cổ phiếu Việt Nam còn lại sau từng điều kiện, theo báo cáo tài chính quý II/2026 và giá ngày 27/08/2026.</text>

<line class="bl" x1="288" y1="100" x2="288" y2="340"/>

<text class="c" x="278" y="127" text-anchor="end">Có bảng cân đối thường</text>
<rect x="288" y="110" width="500" height="26" rx="2" fill="var(--cv-n1,#a9bfb0)"/>
<text class="v" x="798" y="127">1.055</text>

<text class="c" x="278" y="167" text-anchor="end">Tài sản ngắn hạn &gt; tổng nợ</text>
<rect x="288" y="150" width="337.9" height="26" rx="2" fill="var(--cv-a2,#9ecbaa)"/>
<text class="v" x="636" y="167">713</text>

<text class="c" x="278" y="207" text-anchor="end">Vốn hóa thấp hơn mức đó</text>
<rect x="288" y="190" width="84.4" height="26" rx="2" fill="var(--cv-a2,#9ecbaa)"/>
<text class="v" x="382" y="207">178</text>

<text class="c" x="278" y="247" text-anchor="end">Net-net: dưới hai phần ba</text>
<rect x="288" y="230" width="41.7" height="26" rx="2" fill="var(--cv-a1,#2e7d43)"/>
<text class="v" x="340" y="247">88</text>

<text class="c" x="278" y="287" text-anchor="end">Vốn hóa từ 500 tỷ đồng</text>
<rect x="288" y="270" width="4.7" height="26" rx="2" fill="var(--cv-a1,#2e7d43)"/>
<text class="v" x="303" y="287">10</text>

<text class="c" x="278" y="327" text-anchor="end">Khớp từ 1 tỷ đồng một phiên</text>
<rect x="288" y="310" width="3.3" height="26" rx="2" fill="var(--cv-neg,#c0562f)"/>
<text class="v" x="302" y="327">7</text>

<text class="s" x="36" y="374">Giá trị tài sản lưu động ròng tính bằng tài sản ngắn hạn trừ toàn bộ nợ phải trả tại 30/06/2026, không trừ lợi ích</text>
<text class="s" x="36" y="392">cổ đông không kiểm soát. Ngân hàng và công ty chứng khoán dùng mẫu báo cáo khác nên không nằm trong 1.055 mã.</text>
<text class="s" x="36" y="410">Nguồn: API VNDirect.</text>
</svg>
