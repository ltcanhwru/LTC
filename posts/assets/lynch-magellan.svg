<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 438" width="880" height="438" role="img" aria-label="Magellan so voi S&P 500 tu 1977 den 1990">
<style>.cvi text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--cv-tx,#15261a)}.cvi .t{font-size:17.5px;font-weight:650}.cvi .s{font-size:12.5px;fill:var(--cv-mu,#4b6551)}.cvi .v{font-size:12.5px;font-weight:650}.cvi .c{font-size:12.5px}.cvi .ax{font-size:11.5px;fill:var(--cv-mu,#4b6551)}.cvi .gl{stroke:var(--cv-gr,#dceed4);stroke-width:1}.cvi .bl{stroke:var(--cv-bd,#c8e2bd);stroke-width:1}</style>
<rect x="0.5" y="0.5" width="879" height="437" rx="14" fill="var(--cv-bg,#f6fbf3)" stroke="var(--cv-bd,#c8e2bd)"/>
<text class="t" x="36" y="40">Mười ba năm Magellan: 10.000 đô thành 280.000</text>
<text class="s" x="36" y="62">Giá trị của 10.000 đô la đầu tư tháng 5/1977, tới khi Peter Lynch rời quỹ tháng 5/1990.</text>
<line class="bl" x1="120" y1="330.0" x2="836" y2="330.0"/><text class="ax" x="110" y="334.0" text-anchor="end">0</text>
<line class="gl" x1="120" y1="293.3" x2="836" y2="293.3"/><text class="ax" x="110" y="297.3" text-anchor="end">+50</text>
<line class="gl" x1="120" y1="256.7" x2="836" y2="256.7"/><text class="ax" x="110" y="260.7" text-anchor="end">+100</text>
<line class="gl" x1="120" y1="220.0" x2="836" y2="220.0"/><text class="ax" x="110" y="224.0" text-anchor="end">+150</text>
<line class="gl" x1="120" y1="183.3" x2="836" y2="183.3"/><text class="ax" x="110" y="187.3" text-anchor="end">+200</text>
<line class="gl" x1="120" y1="146.7" x2="836" y2="146.7"/><text class="ax" x="110" y="150.7" text-anchor="end">+250</text>
<line class="gl" x1="120" y1="110.0" x2="836" y2="110.0"/><text class="ax" x="110" y="114.0" text-anchor="end">+300</text>
<rect x="252.5" y="124.7" width="110.0" height="205.3" rx="2" fill="var(--cv-a1,#2e7d43)"/>
<text class="v" x="307.5" y="117.7" text-anchor="middle">+280</text>
<text class="c" x="307.5" y="356" text-anchor="middle">Magellan</text>
<text class="ax" x="307.5" y="374" text-anchor="middle">29,2%/năm</text>
<rect x="607.5" y="304.3" width="110.0" height="25.7" rx="2" fill="var(--cv-n1,#a9bfb0)"/>
<text class="v" x="662.5" y="297.3" text-anchor="middle">+35</text>
<text class="c" x="662.5" y="356" text-anchor="middle">S&P 500</text>
<text class="ax" x="662.5" y="374" text-anchor="middle">≈10%/năm</text>
<text class="s" x="36" y="400">Magellan đạt 29,2% một năm trong mười ba năm; chỉ số S&P 500 cùng kỳ khoảng 10% một năm.</text>
<text class="s" x="36" y="420">Đơn vị: nghìn đô la. Nguồn: số liệu công bố về Fidelity Magellan Fund.</text>
</svg>