<text class="s" x="36" y="400">Bội số trung vị của từng nhóm. Nhóm vốn hóa lớn nhất nhân 2,48 lần, nhóm nhỏ nhất 1,36 lần.</text>
<text class="s" x="36" y="420">Nguồn: API VNDirect, giá đã điều chỉnh chia tách và cổ tức.</text>
