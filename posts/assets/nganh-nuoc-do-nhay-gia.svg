<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 410" width="880" height="410" role="img" aria-label="EPS cua DNW theo bon kich ban tang gia nuoc, kem ty so P/E tuong ung">
<style>.cvi text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--cv-tx,#15261a)}.cvi .t{font-size:17.5px;font-weight:650}.cvi .s{font-size:12.5px;fill:var(--cv-mu,#4b6551)}.cvi .v{font-size:12.5px;font-weight:650}.cvi .c{font-size:12.5px}.cvi .ax{font-size:11.5px;fill:var(--cv-mu,#4b6551)}.cvi .gl{stroke:var(--cv-gr,#dceed4);stroke-width:1}.cvi .bl{stroke:var(--cv-bd,#c8e2bd);stroke-width:1}.cvi .ln{stroke:var(--cv-mu,#4b6551);stroke-width:1.4;fill:none}.cvi .dl{stroke:var(--cv-n1,#a9bfb0);stroke-width:2}</style>
<rect x="0.5" y="0.5" width="879" height="409" rx="14" fill="var(--cv-bg,#f6fbf3)" stroke="var(--cv-bd,#c8e2bd)"/>
<text class="t" x="36" y="40">Đòn bẩy giá nước với nhóm A, lấy DNW làm ví dụ (EPS, đồng/cp)</text>
<text class="s" x="36" y="62">Mỗi 1% tăng giá bán ≈ 11,5 tỷ lợi nhuận về cổ đông mẹ ≈ 96 đồng EPS, tương đương +3,4%.</text>
<line class="gl" x1="110" y1="110" x2="836" y2="110"/><text class="ax" x="100" y="114" text-anchor="end">4.500</text>
<line class="gl" x1="110" y1="180" x2="836" y2="180"/><text class="ax" x="100" y="184" text-anchor="end">3.000</text>
<line class="gl" x1="110" y1="250" x2="836" y2="250"/><text class="ax" x="100" y="254" text-anchor="end">1.500</text>
<line class="bl" x1="110" y1="320" x2="836" y2="320"/><text class="ax" x="100" y="324" text-anchor="end">0</text>
<rect x="155" y="190.5" width="90" height="129.5" rx="2" fill="var(--cv-n1,#a9bfb0)"/><text class="v" x="200" y="183" text-anchor="middle">2.775</text>
<rect x="335" y="168.1" width="90" height="151.9" rx="2" fill="var(--cv-a2,#9ecbaa)"/><text class="v" x="380" y="161" text-anchor="middle">3.255</text>
<rect x="515" y="145.7" width="90" height="174.3" rx="2" fill="var(--cv-a2,#9ecbaa)"/><text class="v" x="560" y="138" text-anchor="middle">3.736</text>
<rect x="695" y="123.2" width="90" height="196.8" rx="2" fill="var(--cv-a1,#2e7d43)"/><text class="v" x="740" y="116" text-anchor="middle">4.216</text>
<text class="c" x="200" y="344" text-anchor="middle">Hiện tại</text><text class="ax" x="200" y="361" text-anchor="middle">P/E 11,7</text>
<text class="c" x="380" y="344" text-anchor="middle">+5%</text><text class="ax" x="380" y="361" text-anchor="middle">P/E 10,0</text>
<text class="c" x="560" y="344" text-anchor="middle">+10%</text><text class="ax" x="560" y="361" text-anchor="middle">P/E 8,7</text>
<text class="c" x="740" y="344" text-anchor="middle">+15%</text><text class="ax" x="740" y="361" text-anchor="middle">P/E 7,7</text>
<text class="s" x="36" y="392">Với nhóm B — mua sỉ rồi bán lẻ — phép tính này không áp dụng: giá mua sỉ tăng theo thì lợi nhuận gần như đứng yên.</text>
</svg>
