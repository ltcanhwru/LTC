<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" role="img" aria-label="Gia tri giao dich moi phien cua tam co phieu nganh nuoc, tinh bang trieu dong">
<style>.cvi text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--cv-tx,#15261a)}.cvi .t{font-size:17.5px;font-weight:650}.cvi .s{font-size:12.5px;fill:var(--cv-mu,#4b6551)}.cvi .v{font-size:12.5px;font-weight:650}.cvi .c{font-size:12.5px}.cvi .ax{font-size:11.5px;fill:var(--cv-mu,#4b6551)}.cvi .gl{stroke:var(--cv-gr,#dceed4);stroke-width:1}.cvi .bl{stroke:var(--cv-bd,#c8e2bd);stroke-width:1}.cvi .ln{stroke:var(--cv-mu,#4b6551);stroke-width:1.4;fill:none}.cvi .dl{stroke:var(--cv-n1,#a9bfb0);stroke-width:2}</style>
<rect x="0.5" y="0.5" width="879" height="429" rx="14" fill="var(--cv-bg,#f6fbf3)" stroke="var(--cv-bd,#c8e2bd)"/>
<text class="t" x="36" y="40">Giá trị giao dịch mỗi phiên (triệu đồng)</text>
<text class="s" x="36" y="62">Bảy trong tám mã dưới 400 triệu đồng một phiên. Năm mã dưới 30 triệu. Hai mã bằng không.</text>
<line class="gl" x1="130" y1="104" x2="130" y2="362"/><text class="ax" x="130" y="98" text-anchor="middle">0</text>
<line class="gl" x1="300" y1="104" x2="300" y2="362"/><text class="ax" x="300" y="98" text-anchor="middle">500</text>
<line class="gl" x1="470" y1="104" x2="470" y2="362"/><text class="ax" x="470" y="98" text-anchor="middle">1.000</text>
<line class="gl" x1="640" y1="104" x2="640" y2="362"/><text class="ax" x="640" y="98" text-anchor="middle">1.500</text>
<text class="v" x="118" y="135" text-anchor="end">BWE</text><rect x="130" y="120" width="493" height="22" rx="2" fill="var(--cv-a1,#2e7d43)"/><text class="v" x="631" y="135">1.450</text><text class="ax" x="852" y="135" text-anchor="end">P/E 8,7 · vốn hóa 10.594 tỷ</text>
<text class="v" x="118" y="171" text-anchor="end">BWS</text><rect x="130" y="156" width="123.8" height="22" rx="2" fill="var(--cv-a2,#9ecbaa)"/><text class="v" x="261.8" y="171">364</text><text class="ax" x="852" y="171" text-anchor="end">P/E 12,5 · cổ tức 6,3%</text>
<text class="v" x="118" y="207" text-anchor="end">DNW</text><rect x="130" y="192" width="8.8" height="22" rx="2" fill="var(--cv-n1,#a9bfb0)"/><text class="v" x="146.8" y="207">26</text><text class="ax" x="852" y="207" text-anchor="end">P/E 11,2 · free float 4,97%</text>
<text class="v" x="118" y="243" text-anchor="end">TDW</text><rect x="130" y="228" width="5.1" height="22" rx="2" fill="var(--cv-n1,#a9bfb0)"/><text class="v" x="143.1" y="243">15</text><text class="ax" x="852" y="243" text-anchor="end">P/E 6,3 — rẻ nhất bảng</text>
<text class="v" x="118" y="279" text-anchor="end">NTW</text><rect x="130" y="264" width="3.7" height="22" rx="2" fill="var(--cv-n1,#a9bfb0)"/><text class="v" x="141.7" y="279">11</text><text class="ax" x="852" y="279" text-anchor="end">P/B 0,98 — dưới sổ sách</text>
<text class="v" x="118" y="315" text-anchor="end">CLW</text><text class="v" x="138" y="315" fill="var(--cv-neg,#c0562f)">0 — cả phiên không khớp lệnh</text><text class="ax" x="852" y="315" text-anchor="end">ROE 23,8% · P/B 2,86</text>
<text class="v" x="118" y="351" text-anchor="end">GDW</text><text class="v" x="138" y="351" fill="var(--cv-neg,#c0562f)">0 — cả phiên không khớp lệnh</text><text class="ax" x="852" y="351" text-anchor="end">cổ tức 10,5% — cao nhất</text>
<line class="bl" x1="130" y1="362" x2="852" y2="362"/>
<text class="s" x="36" y="392">BWE giao dịch trong một phiên nhiều hơn TDW, NTW, CLW và GDW cộng lại trong nhiều tuần.</text>
<text class="ax" x="36" y="412">Phiên 27/08/2026 với BWE, DNW, CLW, GDW; bình quân 10 phiên với BWS, TDW, NTW. TDM không lấy được số đáng tin cậy.</text>
</svg>
