<text class="t" x="36" y="40">Biên lợi nhuận gộp theo quý</text>
<text class="s" x="36" y="62">Quý nguyên liệu đắt nhất lại là quý biên gộp cao nhất — vì hàng bán ra mua từ bốn tháng trước.</text>

