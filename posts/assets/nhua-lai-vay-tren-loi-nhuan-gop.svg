<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Chi phi lai vay chiem bao nhieu phan loi nhuan gop nua dau 2026, tu 0 phan tram o BMP toi 53,6 phan tram o TDP">
<style>.cvi text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--cv-tx,#15261a)}.cvi .t{font-size:17.5px;font-weight:650}.cvi .s{font-size:12.5px;fill:var(--cv-mu,#4b6551)}.cvi .v{font-size:12.5px;font-weight:650}.cvi .m{font-size:13px;font-weight:650}.cvi .ax{font-size:11.5px;fill:var(--cv-mu,#4b6551)}.cvi .gl{stroke:var(--cv-gr,#dceed4);stroke-width:1}</style>
<rect x="0.5" y="0.5" width="879" height="469" rx="14" fill="var(--cv-bg,#f6fbf3)" stroke="var(--cv-bd,#c8e2bd)"/>
<text class="t" x="36" y="40">Chi phí lãi vay trên lợi nhuận gộp, nửa đầu 2026</text>
<text class="s" x="36" y="62">Phần lợi nhuận gộp đã thuộc về ngân hàng trước khi tính đến bán hàng, quản lý và thuế.</text>

<line class="gl" x1="378" y1="86" x2="378" y2="412"/><text class="ax" x="378" y="80" text-anchor="middle">25%</text>
<line class="gl" x1="635" y1="86" x2="635" y2="412"/><text class="ax" x="635" y="80" text-anchor="middle">50%</text>
<line x1="120" y1="86" x2="120" y2="412" stroke="var(--cv-bd,#c8e2bd)" stroke-width="1"/>

<text class="m" x="110" y="109" text-anchor="end">BMP</text><rect x="120" y="94" width="3" height="20" fill="var(--cv-a1,#2e7d43)"/><text class="v" x="133" y="109">0,0%</text>
<text class="m" x="110" y="143" text-anchor="end">NTP</text><rect x="120" y="128" width="34" height="20" fill="var(--cv-a1,#2e7d43)"/><text class="v" x="162" y="143">3,3%</text>
<text class="m" x="110" y="177" text-anchor="end">NHH</text><rect x="120" y="162" width="65" height="20" fill="var(--cv-a1,#2e7d43)"/><text class="v" x="193" y="177">6,3%</text>
<text class="m" x="110" y="211" text-anchor="end">AAA</text><rect x="120" y="196" width="110" height="20" fill="var(--cv-a1,#2e7d43)"/><text class="v" x="238" y="211">10,7%</text>
<text class="m" x="110" y="245" text-anchor="end">TPP</text><rect x="120" y="230" width="283" height="20" fill="var(--cv-wa,#bf860f)"/><text class="v" x="411" y="245">27,5%</text>
<text class="m" x="110" y="279" text-anchor="end">HCD</text><rect x="120" y="264" width="293" height="20" fill="var(--cv-wa,#bf860f)"/><text class="v" x="421" y="279">28,4%</text>
<text class="m" x="110" y="313" text-anchor="end">DNP</text><rect x="120" y="298" width="379" height="20" fill="var(--cv-wa,#bf860f)"/><text class="v" x="507" y="313">36,8%</text>
<text class="m" x="110" y="347" text-anchor="end">PLP</text><rect x="120" y="332" width="467" height="20" fill="var(--cv-neg,#c0562f)"/><text class="v" x="595" y="347">45,3%</text>
<text class="m" x="110" y="381" text-anchor="end">TDP</text><rect x="120" y="366" width="552" height="20" fill="var(--cv-neg,#c0562f)"/><text class="v" x="680" y="381" fill="var(--cv-neg,#c0562f)">53,6%</text>

<text class="s" x="36" y="436">BMP có tiền ròng dương 1.599,6 tỷ đồng. TDP có nợ vay 3.146,5 tỷ trên vốn chủ sở hữu 1.277,7 tỷ,</text>
<text class="s" x="36" y="454">và vẫn được thị trường trả P/E 21,77 lần — cao nhất nhóm sản xuất.</text>
</svg>
