<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 438" width="880" height="438" role="img" aria-label="Hai con duong tang von gop">
<style>.cvi text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--cv-tx,#15261a)}.cvi .t{font-size:17.5px;font-weight:650}.cvi .s{font-size:12.5px;fill:var(--cv-mu,#4b6551)}.cvi .v{font-size:12.5px;font-weight:650}.cvi .c{font-size:12.5px}.cvi .ax{font-size:11.5px;fill:var(--cv-mu,#4b6551)}.cvi .gl{stroke:var(--cv-gr,#dceed4);stroke-width:1}.cvi .bl{stroke:var(--cv-bd,#c8e2bd);stroke-width:1}</style>
<rect x="0.5" y="0.5" width="879" height="437" rx="14" fill="var(--cv-bg,#f6fbf3)" stroke="var(--cv-bd,#c8e2bd)"/>
<text class="t" x="36" y="40">Tăng vốn bằng tiền mới và tăng vốn bằng bút toán</text>
<text class="s" x="36" y="62">158 cổ phiếu tăng vốn góp từ 50% trở lên trong năm năm, tách theo tiền thực thu từ phát hành cổ phiếu.</text>
<line class="gl" x1="120" y1="330.0" x2="836" y2="330.0"/><text class="ax" x="110" y="334.0" text-anchor="end">-30%</text>
<line class="gl" x1="120" y1="293.3" x2="836" y2="293.3"/><text class="ax" x="110" y="297.3" text-anchor="end">-20%</text>
<line class="gl" x1="120" y1="256.7" x2="836" y2="256.7"/><text class="ax" x="110" y="260.7" text-anchor="end">-10%</text>
<line class="bl" x1="120" y1="220.0" x2="836" y2="220.0"/><text class="ax" x="110" y="224.0" text-anchor="end">0</text>
<line class="gl" x1="120" y1="183.3" x2="836" y2="183.3"/><text class="ax" x="110" y="187.3" text-anchor="end">+10%</text>
<line class="gl" x1="120" y1="146.7" x2="836" y2="146.7"/><text class="ax" x="110" y="150.7" text-anchor="end">+20%</text>
<line class="gl" x1="120" y1="110.0" x2="836" y2="110.0"/><text class="ax" x="110" y="114.0" text-anchor="end">+30%</text>
<rect x="193.3" y="220.0" width="110.0" height="106.3" rx="2" fill="var(--cv-neg,#c0562f)"/>
<text class="v" x="248.3" y="341.3" text-anchor="middle">-29%</text>
<text class="c" x="248.3" y="356" text-anchor="middle">Thu tiền mới</text>
<text class="ax" x="248.3" y="374" text-anchor="middle">102 mã</text>
<rect x="430.0" y="125.4" width="110.0" height="94.6" rx="2" fill="var(--cv-a1,#2e7d43)"/>
<text class="v" x="485.0" y="118.4" text-anchor="middle">+25,8%</text>
<text class="c" x="485.0" y="356" text-anchor="middle">Chủ yếu chia thưởng</text>
<text class="ax" x="485.0" y="374" text-anchor="middle">56 mã</text>
<rect x="666.7" y="189.9" width="110.0" height="30.1" rx="2" fill="var(--cv-a2,#9ecbaa)"/>
<text class="v" x="721.7" y="182.9" text-anchor="middle">+8,2%</text>
<text class="c" x="721.7" y="356" text-anchor="middle">Không tăng vốn góp</text>
<text class="ax" x="721.7" y="374" text-anchor="middle">213 mã</text>
<text class="s" x="36" y="400">Mức tăng giá trung vị từ 27/08/2021 đến 27/08/2026, đã tính lại cổ phiếu thưởng. Ngưỡng tách là 5% vốn hóa tại ngày lập.</text>
<text class="s" x="36" y="420">Nguồn: lưu chuyển tiền tệ năm 2021–2025 và giá qua API VNDirect.</text>
</svg>