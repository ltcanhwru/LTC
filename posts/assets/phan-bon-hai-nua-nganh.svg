<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" role="img" aria-label="Bieu do phan tan: tang truong doanh thu nua dau 2026 va thay doi bien loi nhuan gop cua chin doanh nghiep phan bon">
<style>.cvi text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--cv-tx,#15261a)}.cvi .t{font-size:17.5px;font-weight:650}.cvi .s{font-size:12.5px;fill:var(--cv-mu,#4b6551)}.cvi .v{font-size:12.5px;font-weight:650}.cvi .c{font-size:12.5px}.cvi .ax{font-size:11.5px;fill:var(--cv-mu,#4b6551)}.cvi .gl{stroke:var(--cv-gr,#dceed4);stroke-width:1}.cvi .bl{stroke:var(--cv-bd,#c8e2bd);stroke-width:1}</style>
<rect x="0.5" y="0.5" width="879" height="469" rx="14" fill="var(--cv-bg,#f6fbf3)" stroke="var(--cv-bd,#c8e2bd)"/>
<text class="t" x="36" y="40">Cùng một cú sốc giá, hai nửa ngành</text>
<text class="s" x="36" y="62">Nửa đầu 2026 so với nửa đầu 2025: trục ngang là doanh thu, trục dọc là biên lợi nhuận gộp.</text>

<line class="gl" x1="120" y1="139.1" x2="810" y2="139.1"/><text class="ax" x="110" y="143.1" text-anchor="end">+20 điểm</text>
<line class="gl" x1="120" y1="217.2" x2="810" y2="217.2"/><text class="ax" x="110" y="221.2" text-anchor="end">+10 điểm</text>
