<circle cx="780.1" cy="296.1" r="7" fill="var(--cv-mu,#4b6551)"/><text class="v" x="780.1" y="284" text-anchor="middle" fill="var(--cv-mu,#4b6551)">SFG</text>

<circle cx="46" cy="405" r="6" fill="var(--cv-a1,#2e7d43)"/><text class="c" x="58" y="409" text-anchor="start">Urê</text>
<circle cx="126" cy="405" r="6" fill="var(--cv-wa,#bf860f)"/><text class="c" x="138" y="409" text-anchor="start">Lân nung chảy</text>
<circle cx="266" cy="405" r="6" fill="var(--cv-neg,#c0562f)"/><text class="c" x="278" y="409" text-anchor="start">Supe lân &amp; DAP (dùng lưu huỳnh)</text>
<circle cx="512" cy="405" r="6" fill="var(--cv-mu,#4b6551)"/><text class="c" x="524" y="409" text-anchor="start">NPK phối trộn</text>

<text class="s" x="36" y="440">Ba nhà máy urê cùng đi lên cả hai trục. Bình Điền lùi 17,2% doanh thu vì sản lượng quý II giảm gần 58%.</text>
<text class="s" x="36" y="458">Lâm Thao và DAP-Vinachem mất biên vì giá lưu huỳnh; Văn Điển và Ninh Bình nung chảy bằng lò, không dùng lưu huỳnh.</text>
