<svg class="cvi" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" width="880" height="420" role="img" aria-label="Chi phi lai vay so voi loi nhuan truoc thue cua muoi doanh nghiep thuy san, sau thang dau 2026">
<style>.cvi text{font-family:Inter,"Segoe UI",Roboto,Arial,sans-serif;fill:var(--cv-tx,#15261a)}.cvi .t{font-size:17.5px;font-weight:650}.cvi .s{font-size:12.5px;fill:var(--cv-mu,#4b6551)}.cvi .v{font-size:12.5px;font-weight:650}.cvi .c{font-size:12.5px}.cvi .ax{font-size:11.5px;fill:var(--cv-mu,#4b6551)}.cvi .gl{stroke:var(--cv-gr,#dceed4);stroke-width:1}.cvi .bl{stroke:var(--cv-bd,#c8e2bd);stroke-width:1}.cvi .ln{stroke:var(--cv-mu,#4b6551);stroke-width:1.4;fill:none}.cvi .dl{stroke:var(--cv-n1,#a9bfb0);stroke-width:2}</style>
<rect x="0.5" y="0.5" width="879" height="419" rx="14" fill="var(--cv-bg,#f6fbf3)" stroke="var(--cv-bd,#c8e2bd)"/>
<text class="t" x="36" y="40">Chi phí lãi vay chia cho lợi nhuận trước thuế (6 tháng đầu 2026)</text>
<text class="s" x="36" y="62">Ba doanh nghiệp mà ngân hàng nhận nhiều tiền hơn cổ đông trong cùng một kỳ kinh doanh.</text>
<line class="gl" x1="130" y1="112" x2="130" y2="378"/><text class="ax" x="130" y="106" text-anchor="middle">0</text>
<line class="gl" x1="288.4" y1="112" x2="288.4" y2="378"/><text class="ax" x="288.4" y="106" text-anchor="middle">0,50</text>
<line class="gl" x1="605.1" y1="112" x2="605.1" y2="378"/><text class="ax" x="605.1" y="106" text-anchor="middle">1,50</text>
<line x1="446.7" y1="112" x2="446.7" y2="378" stroke="var(--cv-neg,#c0562f)" stroke-width="1.4" stroke-dasharray="5 4"/>
<text class="v" x="446.7" y="106" text-anchor="middle" fill="var(--cv-neg,#c0562f)">1,00</text>
<text class="v" x="118" y="143" text-anchor="end">ASM</text><rect x="130" y="128" width="541.7" height="22" rx="2" fill="var(--cv-neg,#c0562f)"/><text class="v" x="679.7" y="143" fill="var(--cv-neg,#c0562f)">1,71</text><text class="ax" x="852" y="143" text-anchor="end">nợ vay 14.075 tỷ</text>
<text class="v" x="118" y="175" text-anchor="end">IDI</text><rect x="130" y="160" width="427.5" height="22" rx="2" fill="var(--cv-neg,#c0562f)"/><text class="v" x="565.5" y="175" fill="var(--cv-neg,#c0562f)">1,35</text><text class="ax" x="852" y="175" text-anchor="end">biên gộp 9,2% — thấp nhất bảng</text>
<text class="v" x="118" y="207" text-anchor="end">CMX</text><rect x="130" y="192" width="392.7" height="22" rx="2" fill="var(--cv-neg,#c0562f)"/><text class="v" x="530.7" y="207" fill="var(--cv-neg,#c0562f)">1,24</text><text class="ax" x="852" y="207" text-anchor="end">nợ ròng gấp 1,76 lần vốn chủ</text>
<text class="v" x="118" y="239" text-anchor="end">ACL</text><rect x="130" y="224" width="294.5" height="22" rx="2" fill="var(--cv-wa,#bf860f)"/><text class="v" x="432.5" y="239" fill="var(--cv-wa,#bf860f)">0,93</text><text class="ax" x="852" y="239" text-anchor="end">biên ròng 2,2%</text>
<text class="v" x="118" y="271" text-anchor="end">MPC</text><rect x="130" y="256" width="72.8" height="22" rx="2" fill="var(--cv-a1,#2e7d43)"/><text class="v" x="210.8" y="271">0,23</text><text class="ax" x="852" y="271" text-anchor="end">nhưng nợ ròng bằng 95% vốn chủ</text>
<text class="v" x="118" y="303" text-anchor="end">FMC</text><rect x="130" y="288" width="47.5" height="22" rx="2" fill="var(--cv-a1,#2e7d43)"/><text class="v" x="185.5" y="303">0,15</text><text class="ax" x="852" y="303" text-anchor="end">dư tiền ròng 462 tỷ</text>
<text class="v" x="118" y="335" text-anchor="end">ANV</text><rect x="130" y="320" width="41.2" height="22" rx="2" fill="var(--cv-a1,#2e7d43)"/><text class="v" x="179.2" y="335">0,13</text>
<text class="v" x="118" y="367" text-anchor="end">VHC</text><rect x="130" y="352" width="15.8" height="22" rx="2" fill="var(--cv-a1,#2e7d43)"/><text class="v" x="153.8" y="367">0,05</text><text class="ax" x="852" y="367" text-anchor="end">dư tiền ròng 724 tỷ</text>
<line class="bl" x1="130" y1="378" x2="852" y2="378"/>
<text class="s" x="36" y="404">Sao Mai (ASM) không phải cổ phiếu thủy sản thuần: phần thủy sản chủ yếu đến từ việc hợp nhất IDI.</text>
