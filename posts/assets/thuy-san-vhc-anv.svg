<text class="c" x="560" y="356" text-anchor="middle">6 tháng đầu 2026</text>
<text class="s" x="36" y="396">Riêng quý II/2026: Vĩnh Hoàn đạt 20,6% — cao nhất tám quý; Nam Việt rơi về 16,1%.</text>
